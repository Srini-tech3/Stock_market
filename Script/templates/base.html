<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Practice Scanner{% endblock %} · NIFTY Options</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <a class="brand" href="{{ url_for('dashboard') }}">NIFTY<span>OPTIONS ANALYZER</span></a>
        <span class="practice-badge">SENSIBULL PRACTICE ONLY</span>
        <nav aria-label="Main navigation">
            <a class="{% if active_page == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">Strategy scanner</a>
            <a class="{% if active_page == 'journal' %}active{% endif %}" href="{{ url_for('journal') }}">Excel journal</a>
            <a class="{% if active_page == 'settings' %}active{% endif %}" href="{{ url_for('settings') }}">Existing rules</a>
        </nav>
        <p class="sidebar-note">CSV input · Workbook rules<br>No real orders or broker execution.<br>Manually place practice trades in Sensibull.</p>
    </aside>
    <main class="content">{% block content %}{% endblock %}</main>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
